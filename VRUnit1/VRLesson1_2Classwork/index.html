<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 1.5 -3" rotation="0 35 0" color="#ffdada"></a-box>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#fffdc7"></a-box>
     
      <a-sphere position="0 1.25 -5" radius="1.25" color="#d2e7d6"></a-sphere>
      <a-sphere position="4 1.25 -5" radius="1.25" color="#c8e1cc"></a-sphere>
      <a-sphere position="-4 1.25 -5" radius="1.25" color="#b8d8be"></a-sphere>
      
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#ffd4e5"></a-cylinder>
      <a-cylinder position="1 0.30 -2" radius="0.6" height="1" color="#eecbff"></a-cylinder>
      <a-cylinder position="1 0.30 -1" radius="0.5" height="0.15" color="#dbdcff"></a-cylinder>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
