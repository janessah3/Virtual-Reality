<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="0 1 0" width="4" height="1" depth="2" color="red"></a-box>
      <a-box position="0 1.7 0" width="2" height="0.7" depth="1.5" color="red"></a-box>
     
      <a-cylinder position="-1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>

     <a-cylinder position="1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>

     <a-cylinder position="-1.3 0.5 -1" radius="0.5" height="0.3"rotation="90 0 0" color="black"></a-cylinder>
     <a-cylinder position="1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
     <a-cylinder position="1 0.30 -1" radius="0.5" height="0.15" color="#dbdcff"></a-cylinder>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

    </a-scene>
  </body>
</html>
